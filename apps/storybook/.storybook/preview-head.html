<script>
  ;(function () {
    try {
      const stored = localStorage.getItem('sb-addon-themes-3')
      const isDark = stored
        ? JSON.parse(stored).current === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches

      if (isDark) {
        document.documentElement.classList.add('dark')
      }
    } catch (e) {}
  })()
</script>
